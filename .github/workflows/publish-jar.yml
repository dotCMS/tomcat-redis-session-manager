name: 'Publishing JAR to JFrog Repository'

on:
  workflow_dispatch:
  pull_request:
    types:
      - closed

jobs:
  build-deploy-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Check if the pull request was indeed merged
        run: |
          if [ "${{ github.event.pull_request.merged }}" != "true" ]; then
            echo "Pull request was not merged. Exiting..."
            exit 0
          fi
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          # Generates ~/.m2/settings.xml with a <server> whose id matches the
          # distributionManagement repository id (dotcms-artifactory) in pom.xml.
          server-id: dotcms-artifactory
          server-username: DOTCMS_ARTIFACTORY_USERNAME
          server-password: DOTCMS_ARTIFACTORY_PASSWORD
      - name: Build and deploy JAR to JFrog Repository
        run: mvn --batch-mode clean deploy
        env:
          DOTCMS_ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USER }}
          DOTCMS_ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
